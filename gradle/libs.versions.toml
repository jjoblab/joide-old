# Catalogue unique des versions — toute version en dur dans un module
# casse la règle (§10). Vérifiées en ligne le 2026-11-15.
[versions]
# Tests (§10 : JUnit 5, rien d'autre ; pas de seuil de couverture)
junitJupiter = "5.14.4"
junitPlatformLauncher = "1.14.4"
# Store JVM : pilote SQLite JDBC (implémentation bureau de BuildStore ;
# NOTICE : Apache-2.0 pour le pilote, SQLite du domaine public embarqué)
sqliteJdbc = "3.49.1.0"
# Pipeline JVM (P3) : compilateur Java ecj (EPL-2.0 — NOTICE), compilateur
# Kotlin embarqué et lecture des métadonnées Kotlin (Apache-2.0 — NOTICE).
# L'APK ne dexé PAS cet artefact (exclusion chez app-android) : le runtime
# embarque le compagnon ecj-art de la brique code-lsp (le MÊME artefact,
# shims ART et resources compris) — la doctrine CodeAssist anti-doublons.
ecj = "3.40.0"
kotlin = "2.3.0"
# Lot XV — StAX sur ART (qui n'en livre pas) : l'API JSR-173 autonome,
# aalto comme implémentation complète, stax2-api pour aalto. La manière
# CodeAssist (« StAX on ART (which ships none): the standalone JSR-173
# API, and aalto as its implementation. Used by the on-device Kotlin
# compiler (IntelliJ-core's descriptor parsing) ») — sans eux, le
# chargeur de descripteurs du compilateur (PluginDescriptorLoader)
# échoue en NoClassDefFoundError TypedXMLStreamReader sur l'appareil
staxApi = "1.0-2"
stax2Api = "4.2.1"
aaltoXml = "1.3.0"
# Pipeline Android (P5) : dexeur et rétrécisseur D8/R8, signature APK,
# assemblage de bundles (Google, Apache-2.0 — NOTICE) ; aapt2 est un
# binaire natif téléchargé à la demande (pas une dépendance de compilation)
r8 = "9.5.32"
apksig = "9.5.1"
bundletool = "1.18.3"
# bundletool déclare ses dépendances en portée runtime seulement :
# guava est requise à la compilation (API ImmutableList)
guava = "32.0.1-jre"
# Modules Android P8 (ADR-015) : même Gradle 9.8.2 que celeris — le couple
# AGP 9.5.0 / Gradle 9.8.2 est celui de la brique, prouvé en famille.
agp = "9.5.0"
# code-lsp (socle :model) publie kotlinx-coroutines en portée runtime
# seulement ; la synchronisation JoIDE lit le StateFlow du dépôt
# d'instantanés (Apache-2.0 — NOTICE) : dépendance de compilation
# explicite, version alignée sur la brique (1.11.0).
kotlinxCoroutines = "1.11.0"
kxml2 = "2.3.0"
# Transport HTTP/SSE du module agent (D-5 : décision du
# propriétaire — OkHttp plutôt qu'une implémentation maison ;
# le transport du résolveur P4 reste maison, ADR-031/056).
okhttp = "5.5.1"
# Patcheur ART du pack du compilateur Kotlin (lot XI) : réécritures
# ASM des classes hostiles à ART avant le dexage (OW2, BSD-3 — NOTICE)
asm = "9.7.1"
# Briques du propriétaire (§6.8, docs/integration/) : versions publiées sur
# JitPack (com.github.jjoblab.*) — celeris 2.1.0 déjà publiée, code-lsp
# v1.15.0 et LayoutLib v3.7.1 étiquetées le 2026-11-18 (jitpack.yml aux six
# modules de rendu) ; jamais de modification des briques — DEMANDES.md.
celeris = "2.1.0"
layoutlib = "v3.7.1"
codelsp = "v1.15.0"
# ADR-085 (D1/D2, chantier des vues) : socle UI AndroidX + Material 3 de
# l'application — versions STABLES épinglées (relevées sur Google Maven le
# 2026-11-19, jamais d'alpha/beta/rc ; la liste blanche d'imports vit dans
# l'ADR, seul Compose est exclu — application Java). compileSdk 37.2 suffit.
androidxAppcompat = "1.8.0"
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
material = "1.14.0"
androidxRecyclerview = "1.4.0"

[libraries]
# Alias de classpath pour build-logic (application du plugin AGP par les
# conventions, jamais de version en dur dans les modules)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
ecj = { module = "org.eclipse.jdt:ecj", version.ref = "ecj" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
# Lot XIX : le plugin compilateur Compose, livré avec la distribution
# du compilateur (même version, Apache-2.0) — dexé dans le pack Kotlin
# (le registrar se charge dans la VM ouvrière) + jar original dans
# jars/ du pack et ressource build-jvm (kotlinc y lit le descripteur
# META-INF/services pour -Xplugin)
compose-compiler-plugin = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin", version.ref = "kotlin" }
stax-api = { module = "javax.xml.stream:stax-api", version.ref = "staxApi" }
stax2-api = { module = "org.codehaus.woodstox:stax2-api", version.ref = "stax2Api" }
aalto-xml = { module = "com.fasterxml:aalto-xml", version.ref = "aaltoXml" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
# ADR-085 (D1/D2) : socle UI de l'application — uniquement les artefacts
# dont le code d'app-android importe une classe (appcompat pour la coque,
# core pour WindowInsetsCompat/ViewCompat, activity pour les résultats et le
# retour système, material pour les thèmes Theme.Material3.* et les
# composants). Les suivants (recyclerview, constraintlayout, coordinatorlayout,
# drawerlayout) entrent aux lots qui les importent (A2, A6).
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
bundletool = { module = "com.android.tools.build:bundletool", version.ref = "bundletool" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
# Éditeur (celeris) : le POM d'android-host tire android-view (et par lui
# core-text, core-syntax, core-language, core-intelligence) ; les
# dépendances ci-dessous ne listent que ce qu'ide-integration nomme.
celeris-android-host = { module = "com.github.jjoblab.celeris:android-host", version.ref = "celeris" }
celeris-android-widgets = { module = "com.github.jjoblab.celeris:android-widgets", version.ref = "celeris" }
celeris-lsp-protocole = { module = "com.github.jjoblab.celeris:lsp-protocole", version.ref = "celeris" }
# Grammaires TextMate compilées (celeris) : les paquets intégrés du
# registre de langages exigent la fabrique pour les langages sans
# analyseur écrit (MIT joni/jcodings consignés dans le NOTICE).
celeris-core-syntax-grammars = { module = "com.github.jjoblab.celeris:core-syntax-grammars", version.ref = "celeris" }
# Serveurs de langage (code-lsp) : moteurs + socle, SANS l'AAR :host
# (ADR-044 : :host exposerait codeide-tooling, interdit §6.8 règle 2b).
codelsp-java = { module = "com.github.jjoblab.code-lsp:jo-codeide-lsp-java", version.ref = "codelsp" }
codelsp-kotlin = { module = "com.github.jjoblab.code-lsp:jo-codeide-lsp-kotlin", version.ref = "codelsp" }
codelsp-xml = { module = "com.github.jjoblab.code-lsp:jo-codeide-lsp-xml", version.ref = "codelsp" }
codelsp-model = { module = "com.github.jjoblab.code-lsp:jo-codeide-lsp-model", version.ref = "codelsp" }
codelsp-index = { module = "com.github.jjoblab.code-lsp:jo-codeide-lsp-index", version.ref = "codelsp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinxCoroutines" }
# OkHttp (Apache-2.0, NOTICE) : transport du module agent (D-5).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# kxml2 : implémentation XmlPull pour les TESTS JVM des résolveurs
# LayoutLib (le framework Android la fournit sur appareil) — MIT.
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }
# Compagnon ecj patché ART (EPL-2.0, NOTICE) : classpath RUNTIME du moteur
# Java uniquement, jamais compilé contre — séparation de licences.
codelsp-ecj-art = { module = "com.github.jjoblab.code-lsp:jo-codeide-lsp-java-ecj-art", version.ref = "codelsp" }
# Aperçu de layouts (LayoutLib) : les 6 modules de rendu, module-inflater
# expose les cinq autres en api (docs/integration/layoutlib.md).
# LIVRAISON CONDITIONNÉE à la demande D-1 (LICENSE LayoutLib, DEMANDES.md).
layoutlib-inflater = { module = "com.github.jjoblab.LayoutLib:module-inflater", version.ref = "layoutlib" }
layoutlib-resources = { module = "com.github.jjoblab.LayoutLib:module-resources", version.ref = "layoutlib" }
layoutlib-drawables = { module = "com.github.jjoblab.LayoutLib:module-drawables", version.ref = "layoutlib" }
layoutlib-themes = { module = "com.github.jjoblab.LayoutLib:module-themes", version.ref = "layoutlib" }
layoutlib-attributes = { module = "com.github.jjoblab.LayoutLib:module-attributes", version.ref = "layoutlib" }
layoutlib-layout = { module = "com.github.jjoblab.LayoutLib:module-layout", version.ref = "layoutlib" }
