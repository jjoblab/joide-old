<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoIDE — Création de projet (maquette)</title>
<!--
  Maquette ADR-É4 — Assistant de création en trois étapes.
  Fichier autonome : aucune ressource externe. Jetons ADR-É2.
-->
<style>
  :root{
    --fond:#0E1116; --surface:#151920; --surfaceHaute:#1B212A; --puits:#0B0E12;
    --bord:#262D38; --bordFin:#1D232C;
    --texte:#E7ECF3; --texte2:#9AA6B5; --texte3:#64707F;
    --accent:#82AAFF; --reussite:#3DDC84; --alerte:#E5C07B; --erreur:#E06C75; --violet:#C678DD;
    --mono:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0C10;color:var(--texte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:22px;padding:28px 24px 64px}
  .entete-page{max-width:1400px;margin:0 auto 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .entete-page h1{font-size:17px;font-weight:600}
  .entete-page .fil{color:var(--texte3);font-size:13px}
  .nav-page{max-width:1400px;margin:0 auto 34px;display:flex;gap:8px;flex-wrap:wrap}
  .nav-page a{color:var(--texte2);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid var(--bordFin);border-radius:999px}
  .nav-page a:hover{color:var(--texte);border-color:var(--bord)}
  .nav-page a.ic{color:var(--texte);border-color:var(--accent);background:rgba(130,170,255,.12)}
  .scène{max-width:1400px;margin:0 auto;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figure figcaption{max-width:390px;margin-top:18px}
  figure figcaption h2{font-size:15px;font-weight:600;margin-bottom:3px}
  figure figcaption p{font-size:13px;color:var(--texte2)}
  figure figcaption p a{color:var(--accent);text-decoration:none}
  .étiquette{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte3);border:1px dashed var(--bord);border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .cadre{width:390px;height:844px;background:var(--fond);border:10px solid #1A1E24;border-radius:54px;
    box-shadow:0 34px 90px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .statut{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;color:var(--texte);font-size:13px;font-weight:600}
  .statut .droite{display:flex;align-items:center;gap:7px}
  .trou{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#05070A;box-shadow:inset 0 0 0 1px #12161C;z-index:9}
  .geste{flex:none;height:26px;display:flex;align-items:center;justify-content:center}
  .geste i{width:120px;height:4px;border-radius:4px;background:var(--texte);opacity:.35}
  .ecran{flex:1;overflow:hidden;display:flex;flex-direction:column}
  /* ---- assistant ---- */
  .sous-barre{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
  .sous-barre .retour{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--texte2)}
  .sous-barre .titre{font-size:17px;font-weight:600;flex:1}
  .sous-barre .compte{font-size:12px;color:var(--texte3);background:var(--surfaceHaute);border-radius:999px;padding:2px 10px}
  .etapes{display:flex;align-items:center;padding:2px 20px 10px;gap:8px}
  .etape{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--texte3)}
  .etape .num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1.5px solid var(--bord);background:transparent;color:var(--texte3)}
  .etape.faite .num{background:var(--reussite);border-color:var(--reussite);color:#07130C}
  .etape.faite{color:var(--texte2)}
  .etape.active .num{background:var(--accent);border-color:var(--accent);color:#0B1524}
  .etape.active{color:var(--texte);font-weight:600}
  .jalon{flex:1;height:2px;border-radius:2px;background:var(--bord)}
  .jalon.faite{background:var(--reussite)}
  .corps{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:4px 20px 8px;gap:8px}
  .corps > *{flex:none}
  .recherche{display:flex;align-items:center;gap:10px;height:38px;border:1.5px solid var(--bord);border-radius:14px;padding:0 12px;color:var(--texte3);background:var(--surface);font-size:13px}
  .puces{display:flex;gap:6px;row-gap:6px;flex-wrap:wrap}
  .puce{font-size:11.5px;padding:5px 9px;border-radius:999px;background:var(--surfaceHaute);color:var(--texte2);border:1px solid var(--bordFin);white-space:nowrap}
  .puce.on{background:rgba(130,170,255,.16);color:var(--accent);border-color:rgba(130,170,255,.45);font-weight:600}
  .puce .n{color:var(--texte2);font-size:11px;margin-left:5px}
  .modele{background:var(--surface);border:1.5px solid var(--bordFin);border-radius:16px;padding:9px 10px;display:flex;gap:10px;align-items:flex-start}
  .modele.choisi{border-color:var(--accent);background:linear-gradient(180deg,rgba(130,170,255,.10),rgba(21,25,32,0) 55%),var(--surface)}
  .tuile{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
  .tuile.android{background:rgba(61,220,132,.14);color:var(--reussite)}
  .tuile.console{background:rgba(130,170,255,.14);color:var(--accent)}
  .tuile.biblio{background:rgba(198,120,221,.14);color:var(--violet)}
  .tuile.vide{background:rgba(154,166,181,.12);color:var(--texte2)}
  .modele .corps{flex:1;min-width:0;padding:0}
  .modele .nom{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modele .desc{display:block;font-size:12px;color:var(--texte2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .franchise{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--alerte);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .franchise.aucune{color:var(--texte3)}
  .modele .tuile-coche{width:20px;height:20px;border-radius:50%;border:2px solid var(--bord);flex:none;display:flex;align-items:center;justify-content:center}
  .modele.choisi .tuile-coche{border-color:var(--accent);background:var(--accent);color:#0B1524}
  .pied-etape{display:flex;gap:10px;padding:0 20px 14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-size:15px;font-weight:600;border:none}
  .btn.primaire{flex:1;background:var(--accent);color:#0B1524}
  .btn.inactif{flex:1;background:var(--surfaceHaute);color:var(--texte3);border:1.5px dashed var(--bord)}
  .btn.fantome{background:transparent;color:var(--texte2);padding:0 18px;border:1px solid var(--bordFin)}
  /* ---- formulaire ---- */
  .champ-bloc{display:flex;flex-direction:column;gap:6px}
  .champ-bloc .etiq{font-size:12px;color:var(--texte2);font-weight:600}
  .champ-bloc .etiq .fac{font-weight:400;color:var(--texte3)}
  .champ{height:48px;border:1.5px solid var(--bord);border-radius:12px;background:var(--surface);display:flex;align-items:center;padding:0 14px;color:var(--texte);font-size:15px}
  .champ.focus{border-color:var(--accent)}
  .champ .mono{font-family:var(--mono);font-size:13.5px}
  .segment{display:flex;background:var(--surfaceHaute);border:1px solid var(--bordFin);border-radius:12px;padding:4px;gap:4px}
  .segment .seg{flex:1;text-align:center;font-size:13px;padding:9px 0;border-radius:9px;color:var(--texte2)}
  .segment .seg.on{background:rgba(130,170,255,.18);color:var(--accent);font-weight:700}
  .note{font-size:12px;color:var(--texte3);display:flex;gap:8px;align-items:flex-start}
  /* ---- récapitulatif ---- */
  .fiche{background:var(--surface);border:1px solid var(--bordFin);border-radius:16px;padding:4px 14px}
  .ligne{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bordFin);font-size:13.5px}
  .ligne:last-child{border-bottom:none}
  .ligne .k{color:var(--texte2)}
  .ligne .v{color:var(--texte);font-weight:600;text-align:right}
  .ligne .v .mono{font-family:var(--mono);font-size:12.5px;font-weight:400}
  .arbo{background:var(--puits);border:1px solid var(--bordFin);border-radius:14px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:19px;color:var(--texte2)}
  .arbo .d{color:var(--texte)}
  .arbo .c{color:var(--synCommentaire)}
  .banniere{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;border-radius:12px;padding:10px 12px}
  .banniere.alerte{background:rgba(229,192,123,.10);border:1px solid rgba(229,192,123,.35);color:var(--alerte)}
  .banniere.info{background:rgba(130,170,255,.10);border:1px solid rgba(130,170,255,.35);color:#AFC6F0}
  .pied{max-width:1400px;margin:48px auto 0;color:var(--texte3);font-size:12px;border-top:1px solid var(--bordFin);padding-top:16px}
  .pied a{color:var(--texte2);text-decoration:none}
</style>
</head>
