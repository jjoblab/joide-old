<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoIDE — Atelier d'édition (maquette)</title>
<!--
  Maquette ADR-É5 — Atelier adaptatif : compact (téléphone, tiroir
  poussé, dock), grand écran (rail, arborescence amarrée, aperçu
  côte à côte, console amarrée). Fichier autonome, jetons ADR-É2.
-->
<style>
  :root{
    --fond:#0E1116; --surface:#151920; --surfaceHaute:#1B212A; --puits:#0B0E12;
    --bord:#262D38; --bordFin:#1D232C;
    --texte:#E7ECF3; --texte2:#9AA6B5; --texte3:#64707F;
    --accent:#82AAFF; --reussite:#3DDC84; --alerte:#E5C07B; --erreur:#E06C75; --violet:#C678DD;
    --synMot:#C678DD; --synType:#E5C07B; --synFonction:#61AFEF; --synChaine:#98C379;
    --synNombre:#D19A66; --synCommentaire:#7C8695; --synDefaut:#D6DAE3;
    --mono:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0C10;color:var(--texte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:22px;padding:28px 24px 64px}
  .entete-page{max-width:1420px;margin:0 auto 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .entete-page h1{font-size:17px;font-weight:600}
  .entete-page .fil{color:var(--texte3);font-size:13px}
  .nav-page{max-width:1420px;margin:0 auto 34px;display:flex;gap:8px;flex-wrap:wrap}
  .nav-page a{color:var(--texte2);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid var(--bordFin);border-radius:999px}
  .nav-page a:hover{color:var(--texte);border-color:var(--bord)}
  .nav-page a.ic{color:var(--texte);border-color:var(--accent);background:rgba(130,170,255,.12)}
  .scène{max-width:1420px;margin:0 auto;display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figure figcaption{max-width:390px;margin-top:18px}
  figure.grand figcaption{max-width:1040px}
  figure figcaption h2{font-size:15px;font-weight:600;margin-bottom:3px}
  figure figcaption p{font-size:13px;color:var(--texte2)}
  figure figcaption p a{color:var(--accent);text-decoration:none}
  .étiquette{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte3);border:1px dashed var(--bord);border-radius:999px;padding:2px 10px;margin-bottom:8px}
  /* ---- cadres ---- */
  .cadre{width:390px;height:844px;background:var(--fond);border:10px solid #1A1E24;border-radius:54px;
    box-shadow:0 34px 90px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .statut{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;color:var(--texte);font-size:13px;font-weight:600}
  .statut .droite{display:flex;align-items:center;gap:7px}
  .trou{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#05070A;box-shadow:inset 0 0 0 1px #12161C;z-index:9}
  .geste{flex:none;height:26px;display:flex;align-items:center;justify-content:center}
  .geste i{width:120px;height:4px;border-radius:4px;background:var(--texte);opacity:.35}
  .ecran{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .fenetre{width:1040px;background:var(--fond);border:1px solid #232A34;border-radius:18px;overflow:hidden;
    box-shadow:0 34px 90px rgba(0,0,0,.55);display:flex;flex-direction:column;height:700px}
  .titre-fenetre{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--bordFin)}
  .titre-fenetre .points{display:flex;gap:8px}
  .titre-fenetre .points i{width:12px;height:12px;border-radius:50%}
  .titre-fenetre .nom-fenetre{flex:1;text-align:center;font-size:13px;color:var(--texte2)}
  .titre-fenetre .outils{display:flex;gap:6px;align-items:center}
  /* ---- barre supérieure & onglets ---- */
  .barre-sup{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 8px}
  .ic-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--texte2);flex:none}
  .barre-sup .nom-projet{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barre-sup .droite-sup{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
  .pilule{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surfaceHaute);color:var(--texte2);border:1px solid var(--bordFin);white-space:nowrap;flex:none}
  .pilule.index{display:flex;align-items:center;gap:6px}
  .pilule.index i{width:7px;height:7px;border-radius:50%;background:var(--reussite)}
  .onglets{flex:none;display:flex;align-items:stretch;gap:2px;padding:0 8px;border-bottom:1px solid var(--bordFin);background:var(--fond);overflow:hidden}
  .onglet{display:flex;align-items:center;gap:7px;padding:8px 11px 6px;font-size:12.5px;color:var(--texte2);border-bottom:2px solid transparent;white-space:nowrap;overflow:hidden}
  .onglet.actif{color:var(--texte);border-bottom-color:var(--accent);background:var(--puits)}
  .onglet .sale{width:7px;height:7px;border-radius:50%;background:var(--alerte)}
  .onglet .fermer{color:var(--texte3);margin-left:2px}
  .onglet.actif .fermer{color:var(--texte2)}
  /* ---- éditeur ---- */
  .editeur{flex:1;background:var(--puits);overflow:hidden;font-family:var(--mono);font-size:12px;line-height:19px;display:flex}
  .numeros{flex:none;width:36px;text-align:right;padding:12px 8px 0 0;color:#3E4A59;user-select:none}
  .code{flex:1;padding:12px 0 56px 8px;white-space:pre;color:var(--synDefaut);overflow:hidden}
  .code .ligne-active{display:block;margin:0 -8px 0 -8px;padding:0 8px;background:rgba(130,170,255,.08);box-shadow:inset 2px 0 0 var(--accent)}
  .k{color:var(--synMot)} .t{color:var(--synType)} .f{color:var(--synFonction)}
  .c{color:var(--synCommentaire)} .n{color:var(--synNombre)}
  .s{color:var(--synChaine)}
  .curseur{display:inline-block;width:2px;height:17px;background:var(--accent);vertical-align:-3px}
  /* ---- dock & FAB ---- */
  .dock{flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;height:48px;background:var(--surface);border-top:1px solid var(--bordFin);color:var(--texte2);font-size:13px}
  .dock .etat{color:var(--reussite);font-weight:600}
  .dock .chev{margin-left:auto;color:var(--texte3)}
  .fab{position:absolute;right:16px;bottom:64px;width:58px;height:58px;border-radius:18px;background:var(--reussite);color:#07130C;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 0 6px rgba(61,220,132,.16)}
  /* ---- tiroir ---- */
  .tiroir-rang{position:absolute;inset:0;display:flex;z-index:5}
  .tiroir-rang .rideau{flex:1;background:rgba(4,6,10,.45)}
  .tiroir{width:300px;background:var(--surfaceHaute);border-right:1px solid var(--bord);display:flex;flex-direction:column;box-shadow:24px 0 60px rgba(0,0,0,.35)}
  .tiroir-titre{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .tiroir-titre .nom{font-size:15px;font-weight:600;flex:1}
  .btn-nouveau{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent);background:rgba(130,170,255,.14);border:1px solid rgba(130,170,255,.4);border-radius:999px;padding:6px 12px}
  .arbre{flex:1;overflow:hidden;padding:4px 10px 12px;font-size:13px;display:flex;flex-direction:column}
  .niveau{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;color:var(--texte2)}
  .niveau .fleche{color:var(--texte3);width:14px;flex:none}
  .niveau.dossier{color:var(--texte)}
  .niveau.actif{background:rgba(130,170,255,.14);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
  .niveau.sorties{color:var(--texte3)}
  .niveau .sale{width:7px;height:7px;border-radius:50%;background:var(--alerte);margin-left:auto}
  .note-sorties{margin-top:auto;padding-top:10px;font-size:11px;color:var(--texte3);border-top:1px dashed var(--bordFin)}
  /* ---- grand écran ---- */
  .grand-rang{flex:1;display:flex;min-height:0}
  .rail{width:56px;flex:none;background:var(--surface);border-right:1px solid var(--bordFin);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
  .rail .ic-btn.on{color:var(--accent);background:rgba(130,170,255,.14)}
  .rail .bas{margin-top:auto}
  .col-arbre{width:242px;flex:none;background:var(--surface);border-right:1px solid var(--bordFin);display:flex;flex-direction:column}
  .col-milieu{flex:1;display:flex;flex-direction:column;min-width:0}
  .rang-apercu{flex:1;display:flex;min-height:0}
  .volet-apercu{width:330px;flex:none;background:var(--surface);border-left:1px solid var(--bordFin);display:flex;flex-direction:column}
  .entete-volet{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;color:var(--texte2);border-bottom:1px solid var(--bordFin)}
  .entete-volet .titre-volet{font-weight:600;color:var(--texte)}
  .entete-volet .outils{margin-left:auto;display:flex;gap:10px;color:var(--texte3)}
  .controles{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 0}
  .seg-apercu{display:flex;background:var(--surfaceHaute);border:1px solid var(--bordFin);border-radius:999px;padding:3px}
  .seg-apercu span{font-size:12px;padding:5px 12px;border-radius:999px;color:var(--texte3)}
  .seg-apercu span.on{background:rgba(130,170,255,.2);color:var(--accent);font-weight:700}
  .surface-apercu{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;background:
    repeating-conic-gradient(#12151B 0% 25%, #0F1218 0% 50%) 50%/22px 22px}
  .perchoir{width:190px;height:320px;background:#FAFAFA;border-radius:22px;border:1px solid #D8DCE2;box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;font-size:12px;color:#1B1F26}
  .perchoir .barre-perchoir{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0;font-size:10px;font-weight:700;color:#3C4048}
  .perchoir .corps-perchoir{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
  .perchoir h3{font-size:17px;color:#1B1F26}
  .perchoir .champ-ui{border:1px solid #C9CED6;border-radius:10px;height:40px;display:flex;align-items:center;padding:0 12px;color:#7A8290}
  .perchoir .btn-ui{background:#2E5B41;color:#EAF6EF;border-radius:10px;height:42px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .stats-apercu{flex:none;padding:8px 14px 10px;font-size:11.5px;color:var(--texte3);border-top:1px solid var(--bordFin)}
  .console-amarree{flex:none;height:130px;background:var(--puits);border-top:1px solid var(--bordFin);display:flex;flex-direction:column}
  .poignee{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12.5px;color:var(--texte2);background:var(--surface)}
  .poignee .etat{color:var(--reussite);font-weight:600}
  .transcript{flex:1;overflow:hidden;font-family:var(--mono);font-size:12px;line-height:19px;padding:8px 16px;color:var(--texte2)}
  .tr .sys{color:var(--accent)} .tr .err{color:var(--erreur)}
  .pied{max-width:1420px;margin:48px auto 0;color:var(--texte3);font-size:12px;border-top:1px solid var(--bordFin);padding-top:16px}
  .pied a{color:var(--texte2);text-decoration:none}
</style>
</head>
