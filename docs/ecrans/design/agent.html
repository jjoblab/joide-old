<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoIDE — Agent (maquette)</title>
<!--
  Maquette ADR-É11 — L'écran de l'agent : tiroir chat dans
  l'atelier, cartes d'outils pliables, dialogue de permission sur
  diff déplié, cartes de questions, usage par tour, erreurs
  actionnables. Fichier autonome, jetons ADR-É2.
-->
<style>
  :root{
    --fond:#0E1116; --surface:#151920; --surfaceHaute:#1B212A; --puits:#0B0E12;
    --bord:#262D38; --bordFin:#1D232C;
    --texte:#E7ECF3; --texte2:#9AA6B5; --texte3:#64707F;
    --accent:#82AAFF; --reussite:#3DDC84; --alerte:#E5C07B; --erreur:#E06C75; --violet:#C678DD;
    --synCommentaire:#7C8695;
    --mono:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0C10;color:var(--texte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:22px;padding:28px 24px 64px}
  .entete-page{max-width:1280px;margin:0 auto 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .entete-page h1{font-size:17px;font-weight:600}
  .entete-page .fil{color:var(--texte3);font-size:13px}
  .nav-page{max-width:1280px;margin:0 auto 34px;display:flex;gap:8px;flex-wrap:wrap}
  .nav-page a{color:var(--texte2);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid var(--bordFin);border-radius:999px}
  .nav-page a:hover{color:var(--texte);border-color:var(--bord)}
  .nav-page a.ic{color:var(--texte);border-color:var(--accent);background:rgba(130,170,255,.12)}
  .scène{max-width:1280px;margin:0 auto;display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figure figcaption{max-width:390px;margin-top:18px}
  figure figcaption h2{font-size:15px;font-weight:600;margin-bottom:3px}
  figure figcaption p{font-size:13px;color:var(--texte2)}
  .étiquette{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte3);border:1px dashed var(--bord);border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .cadre{width:390px;height:844px;background:var(--fond);border:10px solid #1A1E24;border-radius:54px;
    box-shadow:0 34px 90px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .statut{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;color:var(--texte);font-size:13px;font-weight:600}
  .statut .droite{display:flex;align-items:center;gap:7px}
  .trou{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#05070A;box-shadow:inset 0 0 0 1px #12161C;z-index:9}
  .geste{flex:none;height:26px;display:flex;align-items:center;justify-content:center}
  .geste i{width:120px;height:4px;border-radius:4px;background:var(--texte);opacity:.35}
  .ecran{flex:1;overflow:hidden;display:flex;flex-direction:column}
  /* ---- atelier derrière le tiroir ---- */
  .atelier-fond{flex:1;display:flex;flex-direction:column;position:relative}
  .barre-atelier{flex:none;height:54px;background:var(--surface);border-bottom:1px solid var(--bordFin);display:flex;align-items:center;gap:10px;padding:0 8px 0 14px}
  .barre-atelier .nom{font-size:15px;font-weight:600}
  .puce-modules{font-size:11.5px;color:var(--texte2);background:var(--surfaceHaute);border:1px solid var(--bordFin);border-radius:999px;padding:3px 9px}
  .barre-atelier .epacer{flex:1}
  .ic-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--texte2);flex:none;position:relative}
  .ic-btn.actif{color:var(--accent);background:rgba(130,170,255,.12)}
  .point-activite{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
  .onglets{flex:none;height:40px;display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--bordFin)}
  .onglet{display:flex;align-items:center;gap:7px;padding:0 15px;font-size:13px;color:var(--texte2);border-right:1px solid var(--bordFin)}
  .onglet.on{color:var(--texte);box-shadow:inset 0 -2px 0 var(--accent)}
  .code-derriere{flex:1;background:var(--puits);font-family:var(--mono);font-size:11.5px;line-height:18px;color:var(--synCommentaire);padding:12px 16px;filter:brightness(.55)}
  /* ---- le tiroir agent ---- */
  .tiroir{position:absolute;inset:0;background:rgba(4,6,9,.44)}
  .agent{position:absolute;top:0;right:0;bottom:0;width:342px;background:var(--fond);border-left:1px solid var(--bord);display:flex;flex-direction:column}
  .agent-tete{flex:none;padding:12px 12px 10px;border-bottom:1px solid var(--bordFin);display:flex;align-items:center;gap:8px}
  .agent-tete .titre{font-size:16px;font-weight:600}
  .agent-tete .epacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--texte2);background:var(--surfaceHaute);border:1px solid var(--bordFin);border-radius:999px;padding:4px 10px;max-width:118px;white-space:nowrap;overflow:hidden}
  .chip .fleche{color:var(--texte3);font-size:9px}
  .chip.mode{color:var(--alerte);border-color:rgba(229,192,123,.35)}
  .transcript{flex:1;overflow:hidden;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px}
  /* messages */
  .msg-util{align-self:flex-end;max-width:86%;background:var(--surfaceHaute);border:1px solid var(--bordFin);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13.5px;line-height:19px}
  .msg-agent{align-self:flex-start;max-width:92%;font-size:13.5px;line-height:19.5px;color:var(--texte)}
  .curseur-flux{display:inline-block;width:7px;height:14px;background:var(--accent);border-radius:1.5px;vertical-align:-2px;animation:pulse 1s infinite alternate;margin-left:2px}
  .raisonnement{align-self:flex-start;width:100%;background:var(--surface);border:1px solid var(--bordFin);border-radius:12px;overflow:hidden}
  .raisonnement .plis{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--texte3)}
  .raisonnement .chevron{font-size:9px}
  .raisonnement .lignes{color:var(--texte3)}
  /* cartes d'outils */
  .carte-outil{align-self:flex-start;width:100%;background:var(--surface);border:1px solid var(--bordFin);border-radius:12px;overflow:hidden}
  .carte-outil .plis{display:flex;align-items:center;gap:9px;padding:9px 12px}
  .carte-outil .point{width:9px;height:9px;border-radius:50%;flex:none}
  .carte-outil .point.cours{background:var(--accent);animation:pulse 1.1s infinite alternate}
  .carte-outil .point.fait{background:var(--reussite)}
  .carte-outil .point.refuse{background:var(--erreur)}
  .carte-outil .nom-outil{font-family:var(--mono);font-size:12px;color:var(--texte)}
  .carte-outil .cible{font-family:var(--mono);font-size:11.5px;color:var(--texte3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .carte-outil .epacer{flex:1}
  .carte-outil .resume{font-size:11.5px;color:var(--texte3)}
  .carte-outil .chevron{font-size:9px;color:var(--texte3)}
  .carte-outil .corps{display:none;border-top:1px solid var(--bordFin);background:var(--puits);padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:17px;color:var(--texte2);white-space:pre-wrap}
  .carte-outil.depliee .corps{display:block}
  .carte-outil.refusee .plis .nom-outil{color:var(--erreur)}
  .ligne-tonale{align-self:flex-start;font-size:11.5px;color:var(--texte3);font-family:var(--mono);padding:1px 4px}
  .ligne-tonale .ok{color:var(--reussite)}
  .attente{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--alerte);font-family:var(--mono);background:rgba(229,192,123,.08);border:1px solid rgba(229,192,123,.3);border-radius:999px;padding:5px 12px}
  .attente i{width:8px;height:8px;border-radius:50%;background:var(--alerte);animation:pulse 1.1s infinite alternate}
  /* carte de question */
  .carte-question{align-self:flex-start;width:100%;background:var(--surface);border:1px solid rgba(130,170,255,.4);border-radius:12px;padding:11px 12px}
  .carte-question .q{font-size:13.5px;font-weight:600;margin-bottom:9px}
  .carte-question .q .num{color:var(--accent);font-family:var(--mono);font-size:11px;margin-right:6px}
  .options{display:flex;flex-wrap:wrap;gap:7px}
  .option{font-size:12.5px;color:var(--texte2);background:var(--surfaceHaute);border:1px solid var(--bord);border-radius:999px;padding:6px 13px}
  .option.on{color:var(--accent);border-color:rgba(130,170,255,.5);background:rgba(130,170,255,.13);font-weight:600}
  .option.autre{color:var(--texte3);border-style:dashed}
  .option.passer{color:var(--texte3)}
  .repondu{margin-top:8px;font-size:11.5px;color:var(--texte3);font-family:var(--mono)}
  /* usage / fin de tour */
  .ligne-usage{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--texte3);padding:1px 4px}
  .ligne-usage b{color:var(--texte2);font-weight:600}
  /* carte d'erreur */
  .carte-erreur{align-self:flex-start;width:100%;background:rgba(224,108,117,.07);border:1px solid rgba(224,108,117,.4);border-radius:12px;padding:11px 12px}
  .carte-erreur .titre-err{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--erreur)}
  .carte-erreur .titre-err .pastille{width:20px;height:20px;border-radius:50%;background:rgba(224,108,117,.16);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
  .carte-erreur .detail-err{font-size:12.5px;color:var(--texte2);margin-top:5px}
  .btn-action{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent);background:rgba(130,170,255,.13);border:1px solid rgba(130,170,255,.45);border-radius:999px;padding:7px 14px;margin-top:10px}
  /* composeur */
  .composeur{flex:none;border-top:1px solid var(--bordFin);padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
  .composeur .rangée{display:flex;gap:8px;align-items:flex-end}
  .saisie{flex:1;min-height:40px;max-height:96px;background:var(--surfaceHaute);border:1px solid var(--bord);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--texte);display:flex;align-items:center}
  .saisie .texte{color:var(--texte3)}
  .btn-envoyer{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#0B0E12;display:flex;align-items:center;justify-content:center;flex:none}
  .btn-envoyer.desactive{background:var(--surfaceHaute);color:var(--texte3)}
  .btn-arreter{flex:1;height:40px;border-radius:12px;background:rgba(224,108,117,.12);border:1px solid rgba(224,108,117,.5);color:var(--erreur);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-arreter .carre{width:10px;height:10px;border-radius:2.5px;background:var(--erreur)}
  /* ---- dialogue de permission (plein écran) ---- */
  .voile-perm{position:absolute;inset:0;background:rgba(4,6,9,.6);display:flex;flex-direction:column;justify-content:flex-end}
  .dialogue-perm{background:var(--fond);border:1px solid var(--bord);border-radius:20px 20px 0 0;margin:14px;max-height:92%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -18px 50px rgba(0,0,0,.5)}
  .perm-tete{flex:none;padding:16px 16px 10px}
  .perm-tete .sur-titre{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--alerte);margin-bottom:4px}
  .perm-tete h3{font-size:16.5px;font-weight:600}
  .perm-tete .cible{font-family:var(--mono);font-size:12px;color:var(--texte2);margin-top:3px}
  .perm-diff{flex:1;overflow:hidden;background:var(--puits);border-top:1px solid var(--bordFin);border-bottom:1px solid var(--bordFin);font-family:var(--mono);font-size:11.5px;line-height:18px;padding:12px 14px}
  .perm-diff .d{display:grid;grid-template-columns:26px 1fr;column-gap:10px}
  .perm-diff .n{color:var(--texte3);text-align:right;user-select:none}
  .perm-diff .moins{background:rgba(224,108,117,.10);color:#E8A0A6}
  .perm-diff .plus{background:rgba(61,220,132,.10);color:#8FE6B4}
  .perm-diff .contexte{color:var(--texte2)}
  .perm-borne{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--texte3);padding:7px 16px;background:var(--puits)}
  .perm-actions{flex:none;display:flex;gap:10px;padding:12px 16px 18px}
  .btn-appliquer{flex:1;height:46px;border-radius:14px;background:var(--reussite);color:#06220F;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .btn-refuser{flex:1;height:46px;border-radius:14px;background:var(--surfaceHaute);border:1px solid var(--bord);color:var(--texte2);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .perm-note{flex:none;text-align:center;font-size:11.5px;color:var(--texte3);padding:0 16px 12px}
  .pied{max-width:1280px;margin:48px auto 0;color:var(--texte3);font-size:12px;border-top:1px solid var(--bordFin);padding-top:16px}
  .pied a{color:var(--texte2);text-decoration:none}
  @keyframes pulse{from{opacity:.4}to{opacity:1}}
  /* ---- lot T : les popups ancrés, la réflexion vivante, les compteurs ---- */
  .popup{position:absolute;background:var(--surface);border:1px solid var(--bordFin);border-radius:16px;box-shadow:0 18px 44px rgba(0,0,0,.5);padding:8px;z-index:5}
  .popup .ligne{display:flex;align-items:center;padding:11px 14px;border-radius:9px;font-size:13.5px;color:var(--texte)}
  .popup .ligne:nth-child(2n){background:var(--surfaceHaute)}
  .ligne-activite{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 0;font-size:12px;color:var(--texte)}
  .ligne-activite .point{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
  .ligne-activite .epacer{flex:1}
  .ligne-activite .ecart{color:var(--texte3)}
  .raisonnement.vivant{border-color:rgba(130,170,255,.4)}
  .raisonnement.vivant .plis{color:var(--accent)}
  .compteur{padding:8px 14px 2px}
  .compteur .nom{display:flex;justify-content:space-between;font-size:12px;color:var(--texte2);margin-bottom:5px}
  .compteur .piste{height:6px;border-radius:999px;background:var(--surfaceHaute);overflow:hidden;display:flex}
  .compteur .rempli{height:100%}
  .popup .pied{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 2px 6px}
  .popup .pied .icone{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--texte2);border-radius:50%}
  .popup .titre-pop{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 4px 8px;font-size:14px;font-weight:600}
  .puce-mod{display:inline-flex;align-items:center;font-size:11.5px;color:var(--texte2);background:var(--surfaceHaute);border:1px solid var(--bordFin);border-radius:999px;padding:4px 10px}
  .puce-mod.on{color:var(--accent);border-color:rgba(130,170,255,.4)}
  .recherche{margin:8px 6px 2px;background:var(--fond);border:1px solid var(--bordFin);border-radius:18px;padding:8px 12px;font-size:13px;color:var(--texte3)}
  .mod-ligne{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;color:var(--texte)}
  .mod-ligne .etoile{color:var(--alerte);margin-left:auto}
  .mod-ligne .coche{color:var(--accent)}
  .sec{font-size:11px;color:var(--texte3);padding:10px 14px 2px}
</style>
</head>
<body>

<header class="entete-page">
  <h1>Agent</h1>
  <span class="fil">JoIDE · écrans v2 · ADR-É11 · tiroir chat de l'atelier · lot S (ADR-064)</span>
</header>

<main class="scène">

  <!-- ============ VUE 1 : CONVERSATION EN COURS ============ -->
  <figure>
    <span class="étiquette">Tiroir ouvert — tour en cours</span>
    <div class="cadre">
      <div class="trou"></div>
      <div class="statut">
        <span>9:41</span>
        <span class="droite">
          <span style="font-size:11px;color:var(--reussite)">●&nbsp;agent</span>
          <svg width="22" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative"><i style="position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px"></i></span><i style="width:1.5px;height:4px;background:currentColor;border-radius:0 1px 1px 0"></i></span>
        </span>
      </div>
      <div class="geste"><i></i></div>
      <div class="ecran">
        <div class="atelier-fond">
          <div class="barre-atelier">
            <span class="ic-btn" style="color:var(--texte2)">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
            </span>
            <span class="nom">MonApp</span>
            <span class="puce-modules">2 modules</span>
            <span class="epacer"></span>
            <span class="ic-btn actif"><span class="point-activite"></span>
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.4 0-2.8-.3-4-1L3 21l1.5-5.5a8.5 8.5 0 1 1 16.5-3.5z"/></svg>
            </span>
            <span class="ic-btn">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4.2" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="10" cy="15.8" r="1.7"/></svg>
            </span>
          </div>
          <div class="onglets">
            <span class="onglet">MainActivity.java</span>
            <span class="onglet on">build.gradle.kts</span>
          </div>
          <div class="code-derriere">
            plugins&nbsp;{<br>
            &nbsp;&nbsp;id("joide.application")<br>
            }<br>
            <br>
            android&nbsp;{<br>
            &nbsp;&nbsp;compileSdk&nbsp;=&nbsp;34<br>
            &nbsp;&nbsp;defaultConfig&nbsp;{<br>
            &nbsp;&nbsp;&nbsp;&nbsp;applicationId&nbsp;=&nbsp;"com.exemple"<br>
          </div>
          <!-- le tiroir agent, poussé depuis la droite -->
          <div class="tiroir"></div>
          <div class="agent">
            <div class="agent-tete">
              <span class="titre">Agent</span>
              <span class="epacer"></span>
              <span class="chip">claude-sonnet-4-5 <span class="fleche">▾</span></span>
              <span class="chip mode">Demander à chaque <span class="fleche">▾</span></span>
              <span class="ic-btn" style="width:32px;height:32px">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3.2" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="8" cy="12.8" r="1.6"/></svg>
              </span>
              <span class="ic-btn" style="width:32px;height:32px">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
              </span>
            </div>
            <div class="transcript">
              <div class="msg-util">Ajoute la dépendance Gson au build.gradle et corrige l'erreur de compilation dans MainActivity.</div>
              <div class="raisonnement">
                <div class="plis">
                  <span class="chevron">▸</span> Raisonnement
                  <span class="epacer" style="flex:1"></span>
                  <span class="lignes">18 lignes</span>
                </div>
              </div>
              <div class="msg-agent">Je regarde d'abord l'état du fichier de build et les diagnostics du module.<span class="curseur-flux"></span></div>
              <div class="carte-outil">
