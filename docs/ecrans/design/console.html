<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoIDE — Console de build (maquette)</title>
<!--
  Maquette ADR-É6 — Console de build (panneau de l'atelier,
  plein écran sur téléphone). Fichier autonome, jetons ADR-É2.
  Le formatage des lignes reste ConsoleBuild (pur, lot F) ;
  seule la présentation change.
-->
<style>
  :root{
    --fond:#0E1116; --surface:#151920; --surfaceHaute:#1B212A; --puits:#0B0E12;
    --bord:#262D38; --bordFin:#1D232C;
    --texte:#E7ECF3; --texte2:#9AA6B5; --texte3:#64707F;
    --accent:#82AAFF; --reussite:#3DDC84; --alerte:#E5C07B; --erreur:#E06C75; --violet:#C678DD;
    --synCommentaire:#7C8695;
    --mono:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0C10;color:var(--texte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:22px;padding:28px 24px 64px}
  .entete-page{max-width:1180px;margin:0 auto 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .entete-page h1{font-size:17px;font-weight:600}
  .entete-page .fil{color:var(--texte3);font-size:13px}
  .nav-page{max-width:1180px;margin:0 auto 34px;display:flex;gap:8px;flex-wrap:wrap}
  .nav-page a{color:var(--texte2);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid var(--bordFin);border-radius:999px}
  .nav-page a:hover{color:var(--texte);border-color:var(--bord)}
  .nav-page a.ic{color:var(--texte);border-color:var(--accent);background:rgba(130,170,255,.12)}
  .scène{max-width:1180px;margin:0 auto;display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figure figcaption{max-width:390px;margin-top:18px}
  figure figcaption h2{font-size:15px;font-weight:600;margin-bottom:3px}
  figure figcaption p{font-size:13px;color:var(--texte2)}
  figure figcaption p a{color:var(--accent);text-decoration:none}
  .étiquette{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte3);border:1px dashed var(--bord);border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .cadre{width:390px;height:844px;background:var(--fond);border:10px solid #1A1E24;border-radius:54px;
    box-shadow:0 34px 90px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .statut{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;color:var(--texte);font-size:13px;font-weight:600}
  .statut .droite{display:flex;align-items:center;gap:7px}
  .trou{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#05070A;box-shadow:inset 0 0 0 1px #12161C;z-index:9}
  .geste{flex:none;height:26px;display:flex;align-items:center;justify-content:center}
  .geste i{width:120px;height:4px;border-radius:4px;background:var(--texte);opacity:.35}
  .ecran{flex:1;overflow:hidden;display:flex;flex-direction:column}
  .ic-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--texte2);flex:none}
  /* ---- en-tête console ---- */
  .sous-barre{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
  .sous-barre .retour{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--texte2)}
  .sous-barre .titre{font-size:17px;font-weight:600}
  .sous-barre .projet{font-size:13px;color:var(--texte2)}
  .etat-pill{display:flex;align-items:center;gap:7px;margin-left:auto;font-size:12px;font-weight:700;color:var(--reussite);background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.4);border-radius:999px;padding:5px 12px}
  .etat-pill i{width:8px;height:8px;border-radius:50%;background:var(--reussite)}
  .etat-pill.echec{color:var(--erreur);background:rgba(224,108,117,.10);border-color:rgba(224,108,117,.4)}
  .etat-pill.echec i{background:var(--erreur)}
  .etat-pill.encours{color:var(--accent);background:rgba(130,170,255,.12);border-color:rgba(130,170,255,.4)}
  .etat-pill.encours i{background:var(--accent);animation:pulse 1.2s infinite alternate}
  @keyframes pulse{from{opacity:.4}to{opacity:1}}
  .actions-console{display:flex;gap:4px;padding:0 12px 8px;align-items:center}
  .phases{display:flex;gap:8px;padding:0 20px 10px;flex-wrap:wrap}
  .phase{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--texte2);background:var(--surface);border:1px solid var(--bordFin);border-radius:999px;padding:6px 12px}
  .phase .coche{width:15px;height:15px;border-radius:50%;background:rgba(61,220,132,.18);color:var(--reussite);display:flex;align-items:center;justify-content:center}
  .phase .durée{color:var(--texte3)}
  .filtres{display:flex;gap:8px;padding:0 20px 12px}
  .puce{font-size:13px;padding:7px 14px;border-radius:999px;background:var(--surfaceHaute);color:var(--texte2);border:1px solid var(--bordFin)}
  .puce.on{background:rgba(130,170,255,.16);color:var(--accent);border-color:rgba(130,170,255,.45);font-weight:600}
  .puce.erreurs{color:var(--erreur);border-color:rgba(224,108,117,.4)}
  /* ---- transcript ---- */
  .transcript{flex:1;background:var(--puits);border-top:1px solid var(--bordFin);overflow:hidden;font-family:var(--mono);font-size:12px;line-height:19px;padding:10px 14px;color:var(--texte2)}
  .tr{display:grid;grid-template-columns:52px 1fr;column-gap:8px;align-items:baseline}
  .tr .t{color:var(--texte)}
  .tr .sys{color:var(--accent)}
  .tr .phase-mot{color:#61AFEF}
  .tr .err{color:var(--erreur)}
  .tr .tach{color:var(--texte2)}
  .tr .durée{color:var(--texte3)}
  .plafond{padding:10px 18px 0;font-family:var(--mono);font-size:10.5px;color:var(--texte3);background:var(--puits)}
  /* ---- problème ---- */
  .probleme{margin:12px 20px 6px;background:rgba(224,108,117,.08);border:1px solid rgba(224,108,117,.4);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
  .probleme .pastille{width:22px;height:22px;border-radius:50%;background:rgba(224,108,117,.16);color:var(--erreur);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .probleme .corps{flex:1;min-width:0}
  .probleme .titre-pb{font-size:13.5px;font-weight:600;color:var(--texte)}
  .probleme .titre-pb .mono{font-family:var(--mono);font-size:12px;color:var(--erreur)}
  .probleme .detail{font-size:12.5px;color:var(--texte2);margin-top:3px}
  .btn-ouvrir{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent);background:rgba(130,170,255,.13);border:1px solid rgba(130,170,255,.45);border-radius:999px;padding:7px 14px;margin-top:10px;width:max-content}
  .pied{max-width:1180px;margin:48px auto 0;color:var(--texte3);font-size:12px;border-top:1px solid var(--bordFin);padding-top:16px}
  .pied a{color:var(--texte2);text-decoration:none}
</style>
</head>
