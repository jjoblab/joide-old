<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoIDE — Accueil « Mes projets » (maquette)</title>
<!--
  Maquette ADR-É3 — Accueil « Mes projets ».
  Fichier autonome : aucune ressource externe (police système, SVG
  inline). Les couleurs sont les jetons de l'ADR-É2, textuellement.
-->
<style>
  :root{
    --fond:#0E1116; --surface:#151920; --surfaceHaute:#1B212A; --puits:#0B0E12;
    --bord:#262D38; --bordFin:#1D232C;
    --texte:#E7ECF3; --texte2:#9AA6B5; --texte3:#64707F;
    --accent:#82AAFF; --reussite:#3DDC84; --alerte:#E5C07B; --erreur:#E06C75; --violet:#C678DD;
    --synMot:#C678DD; --synType:#E5C07B; --synFonction:#61AFEF; --synChaine:#98C379;
    --synNombre:#D19A66; --synCommentaire:#7C8695; --synDefaut:#D6DAE3;
    --mono:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0C10;color:var(--texte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:22px;padding:28px 24px 64px}
  /* ---- chrome de page (présentation) ---- */
  .entete-page{max-width:1180px;margin:0 auto 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .entete-page h1{font-size:17px;font-weight:600}
  .entete-page .fil{color:var(--texte3);font-size:13px}
  .nav-page{max-width:1180px;margin:0 auto 34px;display:flex;gap:8px;flex-wrap:wrap}
  .nav-page a{color:var(--texte2);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid var(--bordFin);border-radius:999px}
  .nav-page a:hover{color:var(--texte);border-color:var(--bord)}
  .nav-page a.ic{color:var(--texte);border-color:var(--accent);background:rgba(130,170,255,.12)}
  .scène{max-width:1180px;margin:0 auto;display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figure figcaption{max-width:390px;margin-top:18px}
  figure figcaption h2{font-size:15px;font-weight:600;margin-bottom:3px}
  figure figcaption p{font-size:13px;color:var(--texte2)}
  figure figcaption p a{color:var(--accent);text-decoration:none}
  .étiquette{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte3);border:1px dashed var(--bord);border-radius:999px;padding:2px 10px;margin-bottom:8px}
  /* ---- cadre téléphone ---- */
  .cadre{width:390px;height:844px;background:var(--fond);border:10px solid #1A1E24;border-radius:54px;
    box-shadow:0 34px 90px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .statut{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;color:var(--texte);font-size:13px;font-weight:600}
  .statut .droite{display:flex;align-items:center;gap:7px}
  .trou{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#05070A;box-shadow:inset 0 0 0 1px #12161C;z-index:9}
  .geste{flex:none;height:26px;display:flex;align-items:center;justify-content:center}
  .geste i{width:120px;height:4px;border-radius:4px;background:var(--texte);opacity:.35}
  .ecran{flex:1;overflow:hidden;display:flex;flex-direction:column}
  /* ---- barre d'application ---- */
  .barre-app{padding:10px 20px 2px}
  .barre-app .titre{font-size:28px;font-weight:700;letter-spacing:-.02em}
  .barre-app .sous{font-size:13px;color:var(--texte2);margin-top:1px}
  .barre-app .actions{position:absolute;top:44px;right:20px;display:flex;gap:4px}
  .ic-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--texte2)}
  .ic-btn:hover{background:var(--surfaceHaute);color:var(--texte)}
  /* ---- composants ---- */
  .contenu{flex:1;overflow:hidden;padding:12px 20px 8px;display:flex;flex-direction:column;gap:10px}
  .carte{background:var(--surface);border:1px solid var(--bordFin);border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px}
  .carte.reprise{border-color:rgba(130,170,255,.35);background:linear-gradient(180deg,rgba(130,170,255,.08),rgba(21,25,32,0) 60%),var(--surface)}
  .tuile{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
  .tuile.android{background:rgba(61,220,132,.14);color:var(--reussite)}
  .tuile.console{background:rgba(130,170,255,.14);color:var(--accent)}
  .tuile.biblio{background:rgba(198,120,221,.14);color:var(--violet)}
  .tuile.vide{background:rgba(154,166,181,.12);color:var(--texte2)}
  .carte .corps{flex:1;min-width:0}
  .carte .lég{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte3);margin-bottom:2px}
  .carte .nom{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .carte .méta{display:block;font-size:13px;color:var(--texte2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--texte3);flex:none}
  .rang-actions{display:flex;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-size:15px;font-weight:600;border:none}
  .btn.primaire{flex:1;background:var(--accent);color:#0B1524}
  .btn.tonal{background:var(--surfaceHaute);color:var(--texte);border:1px solid var(--bordFin);padding:0 18px}
  .sect{display:flex;align-items:center;gap:8px;margin-top:6px}
  .sect .nom-sect{font-size:13px;font-weight:600;color:var(--texte2)}
  .sect .compte{font-size:11px;color:var(--texte2);background:var(--surfaceHaute);border-radius:999px;padding:1px 8px}
  .vide-zone{flex:1;border:1.5px dashed var(--bord);border-radius:28px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;margin-top:8px}
  .vide-zone .titre-vide{font-size:16px;font-weight:600}
  .vide-zone .aide{font-size:13px;color:var(--texte2);max-width:260px}
  .vide-zone .rang-actions{flex-direction:column;width:100%;margin-top:10px}
  .pied{max-width:1180px;margin:48px auto 0;color:var(--texte3);font-size:12px;border-top:1px solid var(--bordFin);padding-top:16px}
  .pied a{color:var(--texte2);text-decoration:none}
</style>
</head>
